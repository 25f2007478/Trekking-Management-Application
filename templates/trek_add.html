{% extends "base_admin.html" %}
{% block content %}
    <main>
        <div class="form-card">
            <h2 style="margin-bottom: 25px; color: #1e5c45;">Add New Trek</h2>

            <form action="{{ url_for('add_trek') }}" method="POST">

                <div class="form-group">
                    <label for="name">Trek Name:</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="location">Location:</label>
                    <input type="text" id="location" name="location" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="difficulty">Difficulty:</label>
                    <select id="difficulty" name="difficulty" class="form-control" required>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="start_date">Start Date:</label>
                    <input type="date" id="start_date" name="start_date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="end_date">End Date:</label>
                    <input type="date" id="end_date" name="end_date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="available_slots">Available Slots:</label>
                    <input type="number" id="available_slots" name="available_slots" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Image URL:</label>
                    <input type="text" name="img" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="assigned_staff">Assign Staff:</label>
                    <select id="assigned_staff" name="assigned_staff" class="form-control" required>
                        <option value="">Select Staff</option>
                    {% for staff in available_staffs %}
                        <option value="{{ staff.staff_profile.id }}">{{ staff.name }}</option>
                    {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn-primary">Add Trek</button>
            </form>
        </div>
    </main>
{% endblock %}
