<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trekking App{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Welcome Admin !!</div>

        <div class="search-container">
            <form action="{{ url_for('admin_search') }}" method="GET" style="display: flex; gap: 10px; width: 800px; max-width: 100%; margin-top:5px; margin-bottom:5px">
                <input type="text" name="search" class="form-control" 
                    placeholder="Search user, staff or Trek" 
                    value="{{ search_query if search_query else '' }}" 
                    style="flex: 1; padding: 12px 15px; border-radius: 8px; border: 2px solid #e0e6ed;">
                
                <button type="submit" style="background-color: #1e5c45; color: white; border: none; padding: 0 25px; border-radius: 8px; font-weight: bold; cursor: pointer;">
                    Search
                </button>
                
                {% if search_query %}
                    <a href="{{ url_for('admin_search') }}" style="display: flex; align-items: center; text-decoration: none; color: #e74c3c; padding: 0 15px; font-weight: bold;">
                        Clear
                    </a>
                {% endif %}
            </form>
        </div>

        <div class="nav-links">
            <a href="{{ url_for('admin_home') }}">Home</a>
            <a href="{{ url_for('admin_staff') }}">Staff Management</a>
            <a href="{{ url_for('admin_user') }}">User Management</a>
            <a href="{{ url_for('admin_trek') }}">Manage Treks</a>
            <a href="{{ url_for('admin_booking') }}">Bookings</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <main class="content-container">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
