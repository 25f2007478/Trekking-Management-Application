{% extends role %}
{% block content %}

    <main>
        <div class="form-card">
            <h2 style="margin-bottom: 25px; color: #1e5c45;">Edit Profile</h2>

            <form action="{{ url_for('edit_profile')}}" method="POST">

                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" class="form-control" value="{{ user.name }}" required>
                </div>
                <div class="form-group">
                    <label for="location">Email:</label>
                    <input type="text" id="email" name="email" class="form-control" value="{{ user.email }}" required>
                </div>
                <div class="form-group">
                    <label for="start_date">Password:</label>
                    <input type="password" id="password" name="password" class="form-control" value="{{ user.password }}" required>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" class="form-control" value="{{ user.dob}}" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender" class="form-control" required>
                        <option value="male" {% if user.gender == 'male' %}selected{% endif %}>Male</option>
                        <option value="female" {% if user.gender == 'female' %}selected{% endif %}>Female</option>
                        <option value="other" {% if user.gender == 'other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mobile:</label>
                    <input type="text" name="mobile" class="form-control" value="{{ user.m_no }}" required>
                </div>
                <button type="submit" class="btn-primary">Update Profile</button>
            </form>
        </div>
    </main>
{% endblock %}
